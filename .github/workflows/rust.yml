name: Rust

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "rust/**"
  # `merge_group` has no `paths` filter, so this runs on every queue entry.
  merge_group: {}

env:
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  test:
    name: cargo:test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ruby
          bundler: none
      - name: Update rubygems & bundler
        run: gem update --system
      - name: Install gems
        run: |
          bundle config set --local without libs:profilers
          bundle install --jobs 4 --retry 3
      - name: Set up vendored RBS source
        run: bundle exec rake rust:rbs:sync
      - name: Install Rust tools
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run tests
        run: |
          cd rust
          cargo test --verbose

  publish-dry-run-ruby-rbs-sys:
    name: rust:publish:ruby-rbs-sys
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Set up git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ruby
          bundler: none
      - name: Update rubygems & bundler
        run: gem update --system
      - name: Install gems
        run: |
          bundle config set --local without libs:profilers
          bundle install --jobs 4 --retry 3
      - name: Set up vendored RBS source
        run: bundle exec rake rust:rbs:sync
      - name: Install Rust tools
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Test publish ruby-rbs-sys
        run: bundle exec rake rust:publish:ruby-rbs-sys
        env:
          RBS_RUST_PUBLISH_DRY_RUN: "1"

  publish-dry-run-ruby-rbs:
    name: rust:publish:ruby-rbs
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Set up git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ruby
          bundler: none
      - name: Update rubygems & bundler
        run: gem update --system
      - name: Install gems
        run: |
          bundle config set --local without libs:profilers
          bundle install --jobs 4 --retry 3
      - name: Set up vendored RBS source
        run: bundle exec rake rust:rbs:sync
      - name: Install Rust tools
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Test publish ruby-rbs
        run: bundle exec rake rust:publish:ruby-rbs
        env:
          RBS_RUST_PUBLISH_DRY_RUN: "1"

  lint:
    name: cargo:lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ruby
          bundler: none
      - name: Update rubygems & bundler
        run: gem update --system
      - name: Install gems
        run: |
          bundle config set --local without libs:profilers
          bundle install --jobs 4 --retry 3
      - name: Set up vendored RBS source
        run: bundle exec rake rust:rbs:sync
      - name: Install Rust tools
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add --toolchain stable clippy rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting
        run: |
          cd rust
          cargo fmt --check
      - name: Run clippy
        run: |
          cd rust
          cargo clippy
